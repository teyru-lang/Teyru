name: release

# The only workflow in this repository.
#
# Every check a CI would run lives in this repository as a make target or a
# script -- `make ci`, `make jdk-diff`, `make notices`, `tests/run.sh` -- and
# this workflow is the one place they are called automatically: when a release is
# published, the released tag is built, the whole suite is run against it, and the
# binaries are attached to the release.
#
# Nothing here runs on a push or a pull request, and nothing else belongs in
# .github/workflows. It can also be started by hand, which is what to do when a
# run fails part way through: the steps after the failure are skipped, so without
# a manual start the release would keep whatever the failure left it with -- the
# first run of this workflow failed in `make ci` and skipped the two steps that
# attach the binaries, and re-running it by hand is cheaper than cutting a tag
# only to retry the same commit.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build, test and attach the binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: build, test and publish the released tag
    runs-on: ubuntu-24.04
    env:
      # Both ways in name the tag: a published release in the event payload, and a
      # manual start in the input. Every step below reads this and nothing else.
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # tests/ is the teyru-lang/tests submodule and the suite is its data
          submodules: recursive

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: set up the JDK the differential compares against
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: the C compilers the suite builds with
        run: sudo apt-get update && sudo apt-get install -y clang gcc

      - name: build the compiler
        run: make build

      - name: the checks a CI job would run (format, vet, the suite under clang and gcc)
        env:
          # `make ci` runs the JDK differential only when TEYRU_JDK names a JDK
          # home, and prints a line saying it did not run when it does not. The
          # JDK set up above lands in JAVA_HOME, so hand it over here: without
          # this the differential is skipped inside `ci` and then fails at the
          # step below, which is how the first run of this workflow went.
          TEYRU_JDK: ${{ env.JAVA_HOME }}
        run: make ci

      - name: the unmodified-Java corpus (tests/java-compat)
        run: make java-compat

      - name: the JDK differential
        env:
          TEYRU_JDK: ${{ env.JAVA_HOME }}
        run: make jdk-diff

      - name: the back-end matrix (every program under both back ends, -O0 and -O2, clang and gcc)
        run: make backend-matrix

      - name: the standard library cache is filled, reused and invalidated
        run: make cache

      - name: third-party notices and the tree agree
        run: make notices

      - name: build the release binaries
        run: |
          tag="$TAG"
          # The binaries carry the tag they were built from, so `teyru version`
          # on a downloaded binary answers with the release rather than with
          # whatever the tree's default happens to be.
          version="${tag#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            echo "building $os/$arch as $version"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-X github.com/teyru-lang/Teyru/internal/driver.version=$version" \
                -o "dist/teyru-$tag-$os-$arch$ext" ./cmd/teyru
          done
          ls -l dist

      - name: attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
